<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modul</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mu:#667085;--ac:#2f6fed;--ok:#1f9d55;--no:#d93f3f;--bd:#d9dde5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--card:#1e222b;--tx:#e8eaf0;--mu:#9aa3b2;--ac:#6b9bff;--ok:#3ec17a;--no:#ff6b6b;--bd:#343a47}}
:root[data-theme="dark"]{--bg:#14171d;--card:#1e222b;--tx:#e8eaf0;--mu:#9aa3b2;--ac:#6b9bff;--ok:#3ec17a;--no:#ff6b6b;--bd:#343a47}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:1rem/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
h2{font-size:1.1rem;margin:0 0 12px}
button{font:inherit;cursor:pointer}
.btn{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:600}
.btn.sec{background:transparent;color:var(--ac);border:1px solid var(--bd)}
.btn:disabled{opacity:.5}
.opt{display:block;width:100%;text-align:left;margin-top:8px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.opt:disabled{opacity:1;cursor:default}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}
.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 18%,transparent)}
.opt.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 16%,transparent)}
.meta{color:var(--mu);font-size:.85rem;display:flex;justify-content:space-between;margin-bottom:8px}
.hide{display:none}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row .nm{flex:1}.row small{display:block;color:var(--mu)}
.row button{width:36px;height:36px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:1.2rem}
.row input{width:56px;padding:8px 2px;text-align:center;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:1rem}
.chk{display:flex;align-items:center;gap:10px;margin-top:10px}
.chk input{width:20px;height:20px}
#pre{display:flex;gap:8px;margin-bottom:6px}#pre button{margin:0}
#qimg,.wimg{max-width:100%;max-height:320px;display:block;margin:0 auto 12px;border-radius:8px}
#cd{font-weight:700;font-size:1.1rem;color:var(--ac)}
#foot{text-align:center;margin-top:14px;color:var(--mu)}#foot div:first-child{font-weight:600;color:var(--tx)}
.hd{display:grid;grid-template-columns:1fr 3.6em 4.6em 7em;gap:6px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);list-style:none;cursor:default}
summary.hd{cursor:pointer}summary.hd::-webkit-details-marker{display:none}
.hd span:nth-child(2),.hd span:nth-child(3){text-align:center}
.th{color:var(--mu);font-size:.8rem}
.badge{font-size:.8rem;font-weight:600;text-align:center;padding:4px 2px;border-radius:8px;color:#fff}
.badge.ok{background:var(--ok)}.badge.no{background:var(--no)}
.wl{padding:6px 0 10px}.wi{padding:10px;margin-top:8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.mine{color:var(--no)}.good{color:var(--ok)}
</style>
</head>
<body>
<main>
 <div class="card" id="s-setup">
  <h2>Modul</h2>
  <div id="pre"></div>
  <button class="btn sec" id="allq" style="margin:10px 0 6px">Összes kérdés elérhető</button>
  <div id="tl"></div>
  <div class="meta" id="msg" style="margin-top:10px"></div>
  <label class="chk"><input type="checkbox" id="o-show"> Helyes válaszok láthatóak</label>
  <label class="chk"><input type="checkbox" id="o-auto"> Automata továbblépés</label>
  <button class="btn" id="start">Indítás</button>
 </div>

 <div class="card hide" id="s-quiz">
  <div class="meta"><span id="qid"></span><span id="cd"></span></div>
  <img id="qimg" class="hide" alt="">
  <h2 id="qtext"></h2>
  <div id="opts"></div>
  <button class="btn hide" id="next">Következő</button>
  <div id="foot"><div id="f1"></div><div id="f2"></div><div id="f3" class="good"></div><div id="f4" class="mine"></div></div>
 </div>

 <div class="card hide" id="s-res">
  <h2>Értékelés</h2>
  <div class="hd th"><span>Témakör</span><span>Helyes</span><span>Helytelen</span><span>Eredmény</span></div>
  <div id="rtab"></div>
  <button class="btn" id="again">Vissza</button>
 </div>
</main>

<script>
// ---- Beállítások ----
const PASS_PERCENT=75;      // megfelelt, ha a jó válaszok aránya témakörönként legalább ennyi %
const BASE_FS=16;          // alap betűméret (px)
const FS_STEPS=5;           // ennyivel növelhető 1 px-es lépésekben (16-17-18-19-20-21)
const AUTO_NEXT_MS=3000;    // automata továbblépés várakozási ideje (ms)
const PRESETS={             // gombnév: {témakör neve a txt "# ..." sorából: kérdésszám}
 "Alap1":{"Földrajz":3,"Történelem":1,"Informatika":0},
 "Alap2":{"Földrajz":1,"Történelem":2,"Informatika":2}
};
// ---------------------
const $=id=>document.getElementById(id);
const h=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e};
let Q=[],topics=[],seen=new Set(),run=null,mem={},IMG={},cnt={},opt={show:true,auto:false};

function parse(txt,d){
 const out=[];let t=d||"",cur=null;
 for(let line of txt.split(/\r?\n/)){
  line=line.trim();if(!line)continue;
  const c=line[0],r=line.slice(1).trim();
  if(c==="#"){t=r;cur=null}
  else if(c==="?"){cur={t,q:r,a:null,w:[],img:""};out.push(cur)}
  else if(cur&&c==="!")cur.img=r;
  else if(cur&&c==="+")cur.a=r;
  else if(cur&&c==="-")cur.w.push(r);
 }
 return out.filter(x=>x.t&&x.q&&x.a&&x.w.length);
}
function setQ(files){
 const p=[];files.forEach(f=>parse(f.text,f.name).forEach(x=>{x.g=f.g||"";p.push(x)}));
 if(!p.length)return 0;
 const c={};p.forEach(x=>{c[x.t]=(c[x.t]||0)+1;x.n=c[x.t];x.id=x.t+"#"+x.n});
 Q=p;topics=[...new Set(Q.map(x=>x.t))];cnt={};
 return p.length;
}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){if(v===undefined)return mem[k]||null;mem[k]=v}}
function loadSeen(){try{seen=new Set(JSON.parse(store("quiz:seen")||"[]"))}catch(e){seen=new Set()}}
function saveSeen(){store("quiz:seen",JSON.stringify([...seen]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id){["s-setup","s-quiz","s-res"].forEach(s=>$(s).classList.toggle("hide",s!==id))}
const unit=x=>x.g||x.t;   // értékelési egység: csoport neve, ha van, különben a témakör
const left=t=>Q.filter(x=>x.t===t&&!seen.has(x.id));

// jelölőnégyzetek
function syncOpt(){$("o-show").checked=opt.show;$("o-auto").checked=opt.auto}
function saveOpt(){store("quiz:opts",JSON.stringify(opt))}
$("o-show").onchange=e=>{opt.show=e.target.checked;syncOpt();saveOpt()};
$("o-auto").onchange=e=>{opt.auto=e.target.checked;saveOpt()};

// előre beállított gombok
Object.keys(PRESETS).forEach(name=>{
 const b=h("button","btn sec",name);
 b.onclick=()=>{topics.forEach(t=>cnt[t]=PRESETS[name][t]||0);refresh()};
 $("pre").appendChild(b);
});
// betűméret gomb
let fsStep=parseInt(store("quiz:fs"))||0;if(!(fsStep>=0&&fsStep<=FS_STEPS))fsStep=0;
const fsBtn=h("button","btn sec");
function applyFs(){document.documentElement.style.fontSize=(BASE_FS+fsStep)+"px";fsBtn.textContent="Aa "+(BASE_FS+fsStep)+"px"}
fsBtn.onclick=()=>{fsStep=(fsStep+1)%(FS_STEPS+1);store("quiz:fs",String(fsStep));applyFs()};
$("pre").appendChild(fsBtn);applyFs();

function refresh(){
 $("tl").replaceChildren();
 topics.forEach(t=>{
  const l=left(t).length,tot=Q.filter(x=>x.t===t).length;
  cnt[t]=Math.min(cnt[t]||0,l);
  const row=h("div","row"),nm=h("div","nm",t);
  nm.appendChild(h("small","",`${l} / ${tot}`));
  const inp=h("input");inp.type="number";inp.min=0;inp.max=l;inp.value=cnt[t];inp.inputMode="numeric";
  const set=v=>{v=Math.max(0,Math.min(l,v||0));cnt[t]=v;inp.value=v};
  inp.onchange=()=>set(parseInt(inp.value));
  const mi=h("button","","−");mi.onclick=()=>set(cnt[t]-1);
  const pl=h("button","","+");pl.onclick=()=>set(cnt[t]+1);
  const rs=h("button","","↺");rs.title="Látott kérdések törlése";
  rs.onclick=()=>{Q.filter(x=>x.t===t).forEach(x=>seen.delete(x.id));saveSeen();refresh()};
  row.append(nm,mi,inp,pl,rs);$("tl").appendChild(row);
 });
 $("msg").textContent="";
}

$("start").onclick=()=>{
 let qs=[];
 topics.forEach(t=>{if(cnt[t]>0)qs.push(...shuffle(left(t)).slice(0,cnt[t]))});
 if(!qs.length){$("msg").textContent="Adj meg legalább egy kérdést valamelyik témakörnél.";return}
 run={qs,i:0,ans:[],sel:null,locked:false,timer:null,show:opt.show,auto:opt.auto,tt:{},tok:{},tbad:{}};
 run.qs.forEach(x=>{const u=unit(x);run.tt[u]=(run.tt[u]||0)+1;run.tok[u]=0;run.tbad[u]=0});
 ask();
};

const imgSrc=p=>IMG[p]||IMG[p.split("/").pop()]||p;
function counts(){
 const x=run.qs[run.i],u=unit(x);let pos=0;
 for(let k=0;k<=run.i;k++)if(unit(run.qs[k])===u)pos++;
 $("f1").textContent=`${u}: ${pos} / ${run.tt[u]}`;
 $("f2").textContent=`Összesen: ${run.i+1} / ${run.qs.length}`;
 $("f3").textContent=run.show?`Helyes: ${run.tok[u]}`:"";
 $("f4").textContent=run.show?`Helytelen: ${run.tbad[u]}`:"";
}
function stopCd(){clearInterval(run.timer);$("cd").textContent=""}
function startCd(){
 stopCd();let n=Math.round(AUTO_NEXT_MS/1000);$("cd").textContent=n;
 run.timer=setInterval(()=>{n--;if(n<=0){stopCd();next()}else $("cd").textContent=n},1000);
}
function ask(){
 stopCd();const x=run.qs[run.i];run.sel=null;run.locked=false;
 seen.add(x.id);saveSeen();
 $("qid").textContent=`${x.t} #${x.n}`;
 counts();
 const im=$("qimg");
 if(x.img){im.src=imgSrc(x.img);im.classList.remove("hide")}else{im.classList.add("hide");im.removeAttribute("src")}
 im.onerror=()=>im.classList.add("hide");
 $("qtext").textContent=x.q;$("next").classList.add("hide");$("opts").innerHTML="";
 shuffle([x.a,...x.w]).forEach(o=>{
  const b=h("button","opt",o);b.onclick=()=>pick(b,o);$("opts").appendChild(b);
 });
 show("s-quiz");
}
function pick(btn,o){
 if(run.locked)return;
 const x=run.qs[run.i];run.sel=o;
 if(run.show){
  run.locked=true;
  [...$("opts").children].forEach(b=>{b.disabled=true;if(b.textContent===x.a)b.classList.add("ok")});
  const u=unit(x);
  if(o===x.a)run.tok[u]++;else{run.tbad[u]++;btn.classList.add("no")}
  counts();
 }else{
  [...$("opts").children].forEach(b=>b.classList.toggle("sel",b===btn));
 }
 $("next").textContent=run.i===run.qs.length-1?"Eredmény":"Következő";
 $("next").classList.remove("hide");
 if(run.auto)startCd();
}
function next(){
 stopCd();
 run.ans[run.i]=run.sel;
 if(++run.i<run.qs.length)return ask();
 results();
}
$("next").onclick=next;

function results(){
 const g={};
 run.qs.forEach((x,i)=>{
  const u=unit(x),r=g[u]||(g[u]={ok:0,bad:[]});
  if(run.ans[i]===x.a)r.ok++;else r.bad.push({x,a:run.ans[i]});
 });
 const box=$("rtab");box.replaceChildren();
 Object.entries(g).forEach(([t,r])=>{
  const n=r.ok+r.bad.length,pass=r.ok*100>=PASS_PERCENT*n,hasBad=r.bad.length>0;
  const row=h(hasBad?"details":"div"),head=h(hasBad?"summary":"div","hd");
  head.append(h("span","",(hasBad?"▸ ":"")+t),h("span","",r.ok),h("span","",r.bad.length),
   h("span","badge "+(pass?"ok":"no"),pass?"Megfelelt":"Nem felelt meg"));
  row.appendChild(head);
  if(hasBad){
   const wl=h("div","wl");
   r.bad.forEach(({x,a})=>{
     const it=h("div","wi");
     if(x.g)it.appendChild(h("div","meta",x.t));
     it.appendChild(h("div","",x.q));
   });
   row.appendChild(wl);
  }
  box.appendChild(row);
 });
 show("s-res");
}
$("again").onclick=()=>{
 topics.forEach(t=>{if(left(t).length===0)Q.filter(x=>x.t===t).forEach(x=>seen.delete(x.id))});
 saveSeen();show("s-setup");refresh();
};
$("allq").onclick=()=>{seen=new Set();saveSeen();topics.forEach(t=>cnt[t]=Q.filter(x=>x.t===t).length);refresh()};

const get=u=>fetch(u).then(r=>r.ok?r.text():Promise.reject());
try{Object.assign(opt,JSON.parse(store("quiz:opts")||"{}"))}catch(e){}
syncOpt();loadSeen();show("s-setup");
get("temak.txt").then(t=>{
 let grp=null;const list=[];
 for(let l of t.split(/\r?\n/)){
  l=l.trim();
  if(!l){grp=null;continue}
  const m=l.match(/^\[(.+)\]$/);
  if(m){grp=m[1].trim();continue}
  list.push({file:l,g:grp});
 }
 return Promise.all(list.map(e=>get(e.file).then(text=>({name:e.file.replace(/\.txt$/i,""),text,g:e.g}))));
}).then(f=>{if(!setQ(f))throw 0;refresh()})
.catch(()=>{$("msg").textContent="A kérdések nem tölthetők be: a temak.txt vagy a benne felsorolt fájlok nem érhetők el.";$("start").disabled=true});
</script>
</body>
</html>
