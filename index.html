<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vizsgakérdések</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#0c0c0c;--mu:#667085;--ac:#2f6fed;--ok:#00b050;--no:#d93f3f;--bd:#d9dde5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--card:#1e222b;--tx:#e8eaf0;--mu:#9aa3b2;--ac:#6b9bff;--ok:#3ec17a;--no:#ff6b6b;--bd:#343a47}}
:root[data-theme="dark"]{--bg:#14171d;--card:#1e222b;--tx:#e8eaf0;--mu:#9aa3b2;--ac:#6b9bff;--ok:#3ec17a;--no:#ff6b6b;--bd:#343a47}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:1rem/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
h2{font-size:1.1rem;margin:0 0 12px}
button{font:inherit;cursor:pointer}
.btn{width:150px;margin-top:14px;padding:12px;border:0;border-radius:10px;background:var(--ok);color:#fff;font-weight:600}
.btn.mke{background:transparent;color:var(--ac);border:1px solid var(--bd)}
.btn:disabled{color:#444444;background:var(--mu);opacity:.6}
.opt{display:block;width:100%;text-align:left;margin-top:8px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.opt:disabled{opacity:1;cursor:default}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}
.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 18%,transparent)}
.opt.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 16%,transparent)}
.meta{color:var(--tx);font-size:1.1rem;display:flex;justify-content:space-between;margin-bottom:8px;font-weight:700}
.hide{display:none!important}
.rh{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--bd);font-weight:700}
.rh .tn{flex:1}
.rh .cl{width:150px;text-align:center}
.row{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--bd)}
.row .nm{flex:1}.row small{display:block}
.row button{width:36px;height:36px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:1.2rem}
.row input{width:64px;padding:6px 2px;text-align:center;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:1rem}
.chk{display:flex;align-items:center;gap:10px;margin-top:10px}
.chk input{width:20px;height:20px}
.chk:has(input:disabled) {color:#888888;opacity:0.6;}
#pre{display:flex;gap:8px;margin-bottom:6px;align-items:flex-end}
#pre2{margin-bottom:6px}
.pw{display:flex;flex-direction:column;gap:4px}
.pw.w1{flex:1;min-width:0}
.pl{font-weight:700}
#pre button{margin:0;width:auto;flex:none;padding:12px 16px}
.pw select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
#pre button{
 border:1px solid var(--bd);
 background:linear-gradient(var(--card),var(--bg));
 box-shadow:0 4px 0 color-mix(in srgb,var(--tx) 25%,var(--bd)),0 6px 10px rgba(0,0,0,.15);
 transform:translateY(0);
 transition:transform .08s,box-shadow .08s;
 -webkit-tap-highlight-color:transparent;
 user-select:none;
}
#pre button:active{
 transform:translateY(4px);
 box-shadow:0 0 0 color-mix(in srgb,var(--tx) 25%,var(--bd)),0 1px 3px rgba(0,0,0,.2);
}
#qimg,.wimg{max-width:100%;max-height:320px;display:block;margin:0 auto 12px;border-radius:8px}
#cd{font-weight:700;font-size:1.1rem;color:var(--ac)}.qn{color:var(--card)}
#foot{display:flex;flex-direction:column;gap:10px;margin-top:14px;color:var(--mu)}
.sfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;color:var(--mu)}
.sopts{font-weight:600;color:var(--tx)}
#fl{text-align:center}
#f1{font-weight:600;color:var(--tx)}
#f4{font-weight:750;color:var(--tx)}
#quit{padding:8px 12px;border:0;border-radius:10px;background:var(--no);color:#fff;font-weight:600;white-space:nowrap;margin-left:auto}
#frow{display:flex;align-items:center;gap:12px;min-height:40px}
#res{width:75%;text-align:center;padding:8px 12px;border:1px solid var(--bd);border-radius:10px;color:#fff;font-weight:600;height:45px;background:var(--bg)}
#res:empty{}
#res.ok{background:var(--ok)}#res.no{background:var(--no)}
.hd{display:grid;grid-template-columns:1fr 3.6em 4.6em 7em;gap:6px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);list-style:none;cursor:default}
summary.hd{cursor:pointer}summary.hd::-webkit-details-marker{display:none}
.hd span:nth-child(2),.hd span:nth-child(3){text-align:center}
.th{color:var(--mu);font-size:.8rem}
.badge{font-weight:700;text-align:center;padding:8px 12px;border-radius:10px;color:#fff}
.badge.ok{background:var(--ok)}.badge.no{background:var(--no)}
.wl{padding:6px 0 10px}.wi{padding:10px;margin-top:8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.mine{color:var(--no)}.good{color:var(--ok)}
#msg:empty{display:none}
.help{font-size:.7rem;color:var(--mu);margin-top:8px}
.row .lk{width:auto;height:auto;padding:4px 2px;border:0;border-radius:0;background:none;color:var(--ac);font:inherit;font-weight:700;text-decoration:underline}
#msg.err{color:var(--no);font-weight:600}
</style>
</head>
<body>
<main>
 <div class="card" id="s-setup">
  <h2>Vizsgakérdések</h2>
  <div id="pre"></div>
  <div id="pre2"></div>
  <button class="btn mke" id="allq" style="margin:10px 0 6px">Összes kérdés<br>elérhető</button>
  <div class="sfoot">
    <div class="sopts"><label class="chk"><input type="checkbox" id="o-show"> Helyes válaszok láthatóak</label>
    <label class="chk"><input type="checkbox" id="o-auto"> Automata továbblépés</label></div>
    <button class="btn" id="start">Indít</button>
  </div>
  <div class="meta" id="msg" style="margin-top:10px"></div>
  <div class="rh"><div class="tn">Modul</div><div class="cl">Kérdésszám</div></div>
  <div class="help">Ö = Összes kérdés elérhető. M = Maximum kérdésszám.</div>
  <div id="tl"></div>
 </div>

 <div class="card hide" id="s-quiz">
  <div class="meta"><span id="qid"></span><span id="cd"></span></div>
  <h2 id="qtext"></h2>
  <img id="qimg" class="hide" alt="">
  <div id="opts"></div>
  <div class="sopts"><label class="chk"><input type="checkbox" id="o-auto2"> Automata továbblépés</label></div>
  <button class="btn" id="next" disabled>Következő</button>
  <div id="foot">
   <div id="fl"><div id="f1"></div><div id="f2" class="good"></div><div id="f3" class="mine"></div><div id="f4"></div></div>
   <div id="frow"><div id="res"></div><button id="quit">Kilépés</button></div>
  </div>
 </div>

 <div class="card hide" id="s-res">
  <h2>Értékelés</h2>
  <div class="hd th"><span>Témakör</span><span>Helyes</span><span>Helytelen</span><span>Eredmény</span></div>
  <div id="rtab"></div>
  <button class="btn" id="again">Vissza</button>
 </div>
</main>

<script>
// Hibajelző: ha bármelyik szkriptben hiba van, kiírja az oldalra (a "Kérdésszámok" fejléc alá).
window.addEventListener("error",e=>{
 const m=document.getElementById("msg");
 if(m){m.className="meta err";m.dataset.keep="1";m.textContent="Hiba: "+e.message+" (sor: "+e.lineno+")"}
});
</script>

<script>
// ===================== BEÁLLÍTÁSOK (ezt szerkesztheted) =====================
const PASS_PERCENT=75;      // megfelelt, ha a helyes válaszok aránya legalább ennyi %
const BASE_FS=16;           // alap betűméret (px)
const FS_INC=2;             // betűméret lépésköz (px)
const FS_STEPS=4;           // hány lépés az alap fölé: 16-18-20-22-24
const AUTO_NEXT_MS=3000;    // automata továbblépés várakozási ideje (ms)

// Gyorsbeállítások nagy témakörönként.
// Külső név = a temak.txt "== Név ==" sora (kis/nagybetű és ékezet nem számít).
// Belső név = a kis témakör neve a txt "# Név" sorából: kérdésszám.
// A "*" minden olyan nagy témakörre érvényes, amelynek nincs saját bejegyzése.
const PRESETS={
"É-D":{
 "Alap, É-D":{"Általános":24,"Műszaki":24,"81-2K":5,"Ev3":5,"Töfi":0,
"É-D vonalismeret":5,"É-D - F.1.":15,"É-D - F.2.":15,"É-D - V.1.":10,"K-Ny vonalismeret":0,"K-Ny - átjárás F.1.":0,"K-Ny - átjárás F.2.":0},
 "Alap, É-D, K-Ny":{"Általános":24,"Műszaki":24,"81-2K":5,"Ev3":5,"Töfi":0,
"É-D vonalismeret":5,"É-D - F.1.":15,"É-D - F.2.":15,"É-D - V.1.":10,"K-Ny vonalismeret":5,"K-Ny - átjárás F.1.":20,"K-Ny - átjárás F.2.":20},
 "Alap, É-D, K-Ny, Töfi":{"Általános":24,"Műszaki":24,"81-2K":5,"Ev3":5,"Töfi":5,
"É-D vonalismeret":5,"É-D - F.1.":15,"É-D - F.2.":15,"É-D - V.1.":10,"K-Ny vonalismeret":5,"K-Ny - átjárás F.1.":20,"K-Ny - átjárás F.2.":20},
 "Alap, É-D, Ev3 nélkül":{"Általános":24,"Műszaki":24,"81-2K":5,"Ev3":0,"Töfi":0,
"É-D vonalismeret":5,"É-D - F.1.":15,"É-D - F.2.":15,"É-D - V.1.":10,"K-Ny vonalismeret":0,"K-Ny - átjárás F.1.":0,"K-Ny - átjárás F.2.":0},
 "Teljes 81-2K":{"Általános":0,"Műszaki":0,"81-2K":65,"Ev3":0,"Töfi":0,
"É-D vonalismeret":0,"É-D - F.1.":0,"É-D - F.2.":0,"É-D - V.1.":0,"K-Ny vonalismeret":0,"K-Ny - átjárás F.1.":0,"K-Ny - átjárás F.2.":0},
 "Teljes É-D F.1., F.2., V.1.":{"Általános":0,"Műszaki":0,"81-2K":0,"Ev3":0,"Töfi":0,
"É-D vonalismeret":0,"É-D - F.1.":120,"É-D - F.2.":103,"É-D - V.1.":20,"K-Ny vonalismeret":0,"K-Ny - átjárás F.1.":0,"K-Ny - átjárás F.2.":0},
 "Teljes K-Ny átjárás F.1., F.2.":{"Általános":0,"Műszaki":0,"81-2K":0,"Ev3":0,"Töfi":0,
"É-D vonalismeret":0,"É-D - F.1.":0,"É-D - F.2.":0,"É-D - V.1.":0,"K-Ny vonalismeret":0,"K-Ny - átjárás F.1.":91,"K-Ny - átjárás F.2.":69},
 "Nulla":{"Általános":0,"Műszaki":0,"81-2K":0,"Ev3":0,"Töfi":0,
"É-D vonalismeret":0,"É-D - F.1.":0,"É-D - F.2.":0,"É-D - V.1.":0,"K-Ny vonalismeret":0,"K-Ny - átjárás F.1.":0,"K-Ny - átjárás F.2.":0}
//},
// "K-Ny":{
// "Alap, K-Ny":{"Általános":24,"Műszaki":24,"AM5-M2":5,"K-Ny vonalismeret":5,"K-Ny - F.1.":15,"K-Ny - F.2.":15,"K-Ny - V.1.":10},
// "Teljes AM5-M2":{"Általános":0,"Műszaki":0,"AM5-M2":33,"K-Ny vonalismeret":0,"K-Ny - F.1.":0,"K-Ny - F.2.":0,"K-Ny - V.1.":0},
// "Teljes K-Ny F.1., F.2., V.1.":{"Általános":0,"Műszaki":0,"AM5-M2":0,"K-Ny vonalismeret":0,"K-Ny - F.1.":90,"K-Ny - F.2.":100,"K-Ny - V.1.":40},
// "Nulla":{"Általános":0,"Műszaki":0,"AM5-M2":0,"K-Ny vonalismeret":0,"K-Ny - F.1.":0,"K-Ny - F.2.":0,"K-Ny - V.1.":0}
}};
// ============================================================================
</script>

<script>
// Ha a beállítások blokkban szintaktikai hiba van, itt alapértékekre állunk vissza.
const P_PASS=typeof PASS_PERCENT!=="undefined"?PASS_PERCENT:75;
const P_BASE=typeof BASE_FS!=="undefined"?BASE_FS:16;
const P_INC=typeof FS_INC!=="undefined"?FS_INC:2;
const P_STEPS=typeof FS_STEPS!=="undefined"?FS_STEPS:4;
const P_AUTO=typeof AUTO_NEXT_MS!=="undefined"?AUTO_NEXT_MS:3000;
const P_PRESETS=typeof PRESETS!=="undefined"?PRESETS:{};

const $=id=>document.getElementById(id);
const h=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e};
const norm=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();
let CS={},PS={};
try{CS=JSON.parse(localStorage.getItem("quiz:cnt")||"{}")||{}}catch(e){}
try{PS=JSON.parse(localStorage.getItem("quiz:pre")||"{}")||{}}catch(e){}
let Q=[],topics=[],seen=new Set(),run=null,mem={},IMG={},cnt={},opt={show:true,auto:false};

function parse(txt,d){
 const out=[];let t=d||"",cur=null;
 for(let line of txt.split(/\r?\n/)){
  line=line.trim();if(!line)continue;
  const c=line[0],r=line.slice(1).trim();
  if(c==="#"){t=r;cur=null}
  else if(c==="?"){cur={t,q:r,a:null,w:[],img:""};out.push(cur)}
  else if(cur&&c==="!")cur.img=r;
  else if(cur&&c==="+")cur.a=r;
  else if(cur&&c==="-")cur.w.push(r);
 }
 return out.filter(x=>x.t&&x.q&&x.a&&x.w.length);
}

function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){if(v===undefined)return mem[k]||null;mem[k]=v}}
function loadSeen(){try{seen=new Set(JSON.parse(store("quiz:seen")||"[]"))}catch(e){seen=new Set()}}
function saveSeen(){store("quiz:seen",JSON.stringify([...seen]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id){["s-setup","s-quiz","s-res"].forEach(s=>$(s).classList.toggle("hide",s!==id))}
const unit=x=>x.g||x.t;   // értékelési egység: csoport neve, ha van, különben a témakör
const left=t=>Q.filter(x=>x.t===t&&!seen.has(x.id));

// jelölőnégyzetek
function syncOpt(){$("o-show").checked=opt.show;$("o-auto").checked=opt.auto;$("o-auto2").checked=opt.auto}
function saveOpt(){store("quiz:opts",JSON.stringify(opt))}
$("o-show").onchange=e=>{opt.show=e.target.checked;syncOpt();saveOpt()};
function setAuto(v){
 opt.auto=v;syncOpt();saveOpt();
 if(!run||$("s-quiz").classList.contains("hide"))return;
 if(!v)stopCd();else if(run.sel!==null)startCd();
}
$("o-auto").onchange=e=>setAuto(e.target.checked);
$("o-auto2").onchange=e=>setAuto(e.target.checked);

// nagy témakör és gyorsbeállítás listák
let ALL=[],SECS=[],cur=0;
const sbig=h("select");sbig.id="bigtopic";
const psel=h("select");psel.id="preset";
function presetsOf(){
 const R=P_PRESETS||{},vals=Object.values(R);
 // régi, lapos forma ("Alap1":{"Téma":3}) is működik, nagy témakör nélkül
 if(vals.length&&vals.every(v=>v&&Object.values(v).every(x=>typeof x==="number")))return R;
 const n=norm(SECS[cur].name);
 const k=Object.keys(R).find(k=>k!=="*"&&norm(k)===n)||(R["*"]?"*":null);
 return k?R[k]:{};
}
function fillPresets(){
 const names=Object.keys(presetsOf());
 if(!names.length){
  const o=new Option("— nincs gyorsbeállítás ehhez: \""+SECS[cur].name+"\" —","");o.disabled=true;
  psel.replaceChildren(o);return;
 }
 psel.replaceChildren(...names.map(n=>new Option(n,n)));
}
function applyPreset(){
 const P=presetsOf()[psel.value]||{},m={};
 Object.keys(P).forEach(k=>m[norm(k)]=P[k]);
 topics.forEach(t=>cnt[t]=m[norm(t)]||0);refresh();
}
function selectSec(i){
 cur=i;Q=[];
 SECS[i].list.forEach(e=>ALL.filter(x=>x.f===e.file).forEach(x=>{x.g=e.g||"";Q.push(x)}));
 topics=[...new Set(Q.map(x=>x.t))];cnt={};
 fillPresets();
 const sp=PS[SECS[i].name];
 if(sp&&[...psel.options].some(o=>o.value===sp&&!o.disabled))psel.value=sp;
 if(topics.some(t=>t in CS)){topics.forEach(t=>cnt[t]=CS[t]||0);refresh()}   // korábban beállított kérdésszámok
 else applyPreset();
}
sbig.onchange=()=>{store("quiz:sec",sbig.value);selectSec(+sbig.value)};
function saveCS(){topics.forEach(t=>CS[t]=cnt[t]||0);store("quiz:cnt",JSON.stringify(CS))}
psel.onchange=()=>{applyPreset();PS[SECS[cur].name]=psel.value;store("quiz:pre",JSON.stringify(PS))};
const wb=h("div","pw w1");wb.append(h("div","pl","Vonal"),sbig);$("pre").appendChild(wb);
const w3=h("div","pw");w3.append(h("div","pl","Modulok gyorsbeállítása"),psel);$("pre2").appendChild(w3);
function init(d){
 const c={};ALL=[];
 Object.keys(d.txt).forEach(f=>parse(d.txt[f],f.replace(/\.txt$/i,"")).forEach(x=>{x.f=f;c[x.t]=(c[x.t]||0)+1;x.n=c[x.t];x.id=x.t+"#"+x.n;ALL.push(x)}));
 if(!ALL.length)return 0;
 SECS=d.secs;
 sbig.replaceChildren(...SECS.map((sc,i)=>new Option(sc.name||"Egyéb",i)));
 wb.style.display=SECS.some(sc=>sc.name)?"":"none";
 let i=parseInt(store("quiz:sec"));if(!(i>=0&&i<SECS.length))i=0;
 sbig.value=i;selectSec(i);return 1;
}

// betűméret gomb
let fsStep=parseInt(store("quiz:fs"))||0;if(!(fsStep>=0&&fsStep<=P_STEPS))fsStep=0;
const fsBtn=h("button","btn mke");
function applyFs(){const px=P_BASE+fsStep*P_INC;document.documentElement.style.fontSize=px+"px";fsBtn.textContent="Aa "+px+"px"}
fsBtn.onclick=()=>{fsStep=(fsStep+1)%(P_STEPS+1);store("quiz:fs",String(fsStep));applyFs()};
const w2=h("div","pw");w2.append(h("div","pl","Betűméret"),fsBtn);$("pre").appendChild(w2);applyFs();w2.style.marginLeft="auto";

function refresh(){
 let ch=false;
 topics.forEach(t=>{if(left(t).length===0){Q.filter(x=>x.t===t).forEach(x=>seen.delete(x.id));ch=true}});
 if(ch)saveSeen();
 $("tl").replaceChildren();
 topics.forEach(t=>{
  const l=left(t).length,tot=Q.filter(x=>x.t===t).length;
  cnt[t]=Math.min(cnt[t]||0,tot);
  const row=h("div","row"),nm=h("div","nm",t);
  const lkO=h("button","lk","Ö"),lkM=h("button","lk","M"),sm=h("small");
  lkO.title="Összes kérdés elérhető";lkM.title="Maximum kérdésszám";
  sm.append(lkO,document.createTextNode(" | "),lkM,document.createTextNode(` | ${tot} / ${l}`));
  nm.appendChild(sm);
  const inp=h("input");inp.type="number";inp.min=0;inp.max=tot;inp.value=cnt[t];inp.inputMode="numeric";
  const set=v=>{v=Math.max(0,Math.min(tot,v||0));cnt[t]=v;inp.value=v;saveCS()};
  inp.onchange=()=>set(parseInt(inp.value));
  const mi=h("button","","−");mi.onclick=()=>set(cnt[t]-1);
  const pl=h("button","","+");pl.onclick=()=>set(cnt[t]+1);
  lkO.onclick=()=>{Q.filter(x=>x.t===t).forEach(x=>seen.delete(x.id));saveSeen();refresh()};
  lkM.onclick=()=>set(tot);
  row.append(nm,mi,inp,pl);$("tl").appendChild(row);
 });
 if(!$("msg").dataset.keep){$("msg").className="meta";$("msg").textContent=""}
 saveCS();
}

$("start").onclick=()=>{
 let qs=[];
 topics.forEach(t=>{
  const n=cnt[t];if(!(n>0))return;
  let pk=shuffle(left(t)).slice(0,n);
  if(pk.length<n)pk=pk.concat(shuffle(Q.filter(x=>x.t===t&&seen.has(x.id))).slice(0,n-pk.length));
  qs.push(...shuffle(pk));
 });
 if(!qs.length){$("msg").textContent="Adj meg legalább egy kérdést valamelyik témakörnél.";return}
 run={qs,i:0,ans:[],sel:null,locked:false,timer:null,show:opt.show,tt:{},tok:{},tbad:{}};
 run.qs.forEach(x=>{const u=unit(x);run.tt[u]=(run.tt[u]||0)+1;run.tok[u]=0;run.tbad[u]=0});
 ask();
};

const imgSrc=p=>IMG[p]||IMG[p.split("/").pop()]||p;
function counts(){
 const x=run.qs[run.i],u=unit(x);let pos=0;
 for(let k=0;k<=run.i;k++)if(unit(run.qs[k])===u)pos++;
 $("f1").textContent=`${u}: ${pos} / ${run.tt[u]}`;
 $("f2").textContent=run.show?`Helyes: ${run.tok[u]}`:"";
 $("f3").textContent=run.show?`Helytelen: ${run.tbad[u]}`:"";
 $("f4").textContent=`Összesen: ${run.i+1} / ${run.qs.length}`;
 // megfelelőségi mező: csak, ha a helyes válaszok láthatók
 const c=run.tok[u],N=run.tt[u],r=N-c-run.tbad[u],cm=$("res");
 let txt="",cls="";
 if(run.show){
  if(c*100>=P_PASS*N){txt="Megfelelt";cls="ok"}            // a hátralévőket hibásnak véve is megvan
  else if((c+r)*100<P_PASS*N){txt="Nem felelt meg";cls="no"} // a hátralévőket jónak véve sem érhető el
 }
 cm.textContent=txt;cm.className=cls;
}
function updNext(){$("next").disabled=!(run.sel!==null);$("o-auto2").disabled=(run.sel!==null)}  // ha megválaszolva: gomb engedélyezve, automata továbblépés tiltott
function startCd(){
 stopCd();
 let n=Math.max(1,Math.round(P_AUTO/1000));$("cd").textContent=n;
 run.timer=setInterval(()=>{n--;if(n<=0){stopCd();next()}else $("cd").textContent=n},1000);
}
function stopCd(){
 if(run)clearInterval(run.timer);$("cd").textContent="";
}
function ask(){
 stopCd();const x=run.qs[run.i];run.sel=null;run.locked=false;
 seen.add(x.id);saveSeen();
 $("qid").textContent=x.t+" ";$("qid").appendChild(h("span","qn","#"+x.n));
 counts();
 const im=$("qimg");
 if(x.img){im.src=imgSrc(x.img);im.classList.remove("hide")}else{im.classList.add("hide");im.removeAttribute("src")}
 im.onerror=()=>im.classList.add("hide");
 $("qtext").textContent=x.q;$("next").textContent=run.i===run.qs.length-1?"Eredmény":"Következő";updNext();$("opts").innerHTML="";
 shuffle([x.a,...x.w]).forEach(o=>{
  const b=h("button","opt",o);b.onclick=()=>pick(b,o);$("opts").appendChild(b);
 });
 show("s-quiz");
}
function pick(btn,o){
 if(run.locked)return;
 const x=run.qs[run.i];run.sel=o;
 if(run.show){
  run.locked=true;
  [...$("opts").children].forEach(b=>{b.disabled=true;if(b.textContent===x.a)b.classList.add("ok")});
  const u=unit(x);
  if(o===x.a)run.tok[u]++;else{run.tbad[u]++;btn.classList.add("no")}
  counts();
 }else{
  [...$("opts").children].forEach(b=>b.classList.toggle("sel",b===btn));
 };
 updNext();
 if(opt.auto)startCd();
}
function next(){
 stopCd();
 if ($("o-auto2")) $("o-auto2").disabled = false;
 run.ans[run.i]=run.sel;
 if(++run.i<run.qs.length)return ask();
 results();
}
$("next").onclick=next;
$("quit").onclick=()=>{if(!confirm("Biztosan kilépsz? A teszt eredménye elvész."))return;stopCd();show("s-setup");refresh()};

function results(){
 const g={};
 run.qs.forEach((x,i)=>{
  const u=unit(x),r=g[u]||(g[u]={ok:0,bad:[]});
  if(run.ans[i]===x.a)r.ok++;else r.bad.push({x,a:run.ans[i]});
 });
 const box=$("rtab");box.replaceChildren();
 Object.entries(g).forEach(([t,r])=>{
  const n=r.ok+r.bad.length,pass=r.ok*100>=P_PASS*n,hasBad=r.bad.length>0;
  const row=h(hasBad?"details":"div"),head=h(hasBad?"summary":"div","hd");
  head.append(h("span","",(hasBad?"▸ ":"")+t),h("span","",r.ok),h("span","",r.bad.length),
   h("span","badge "+(pass?"ok":"no"),pass?"Igen":"Nem"));
  row.appendChild(head);
  if(hasBad){
   const wl=h("div","wl");
   r.bad.forEach(({x,a})=>{
     const it=h("div","wi");
     if(x.g)it.appendChild(h("div","meta",x.t));
     it.appendChild(h("div","",x.q));
     if(x.img){const im=h("img","wimg");im.src=imgSrc(x.img);im.onerror=()=>im.remove();it.appendChild(im)}
     it.append(h("div","mine","Te: "+a),h("div","good","Helyes: "+x.a));
     wl.appendChild(it);
   });
   row.appendChild(wl);
  }
  box.appendChild(row);
 });
 show("s-res");
}
$("again").onclick=()=>{saveSeen();show("s-setup");refresh()};
$("allq").onclick=()=>{seen=new Set();saveSeen();refresh()};

// fájlbetöltés: UTF-8, ha nem az, akkor Windows-1250 (ékezetes ANSI txt is működik)
const get=u=>fetch(u).then(r=>{if(!r.ok)throw u;return r.arrayBuffer()}).then(b=>{
 try{return new TextDecoder("utf-8",{fatal:true}).decode(b)}catch(e){return new TextDecoder("windows-1250").decode(b)}
}).catch(e=>{throw typeof e==="string"?e:u});
try{Object.assign(opt,JSON.parse(store("quiz:opts")||"{}"))}catch(e){}
syncOpt();loadSeen();show("s-setup");
get("temak.txt").then(t=>{
 const secs=[];let sec=null,grp=null;
 for(let l of t.split(/\r?\n/)){
  l=l.trim();
  if(!l){grp=null;continue}
  let m=l.match(/^==\s*(.+?)\s*==$/);
  if(m){sec={name:m[1],list:[]};secs.push(sec);grp=null;continue}
  m=l.match(/^\[(.+)\]$/);
  if(m){grp=m[1].trim();continue}
  if(!sec){sec={name:"",list:[]};secs.push(sec)}
  sec.list.push({file:l,g:grp});
 }
 const files=[...new Set(secs.flatMap(sc=>sc.list.map(e=>e.file)))];
 return Promise.all(files.map(f=>get(f).then(x=>[f,x]))).then(arr=>({secs,txt:Object.fromEntries(arr)}));
}).then(d=>{if(!init(d))throw 0})
.catch(e=>{
 $("msg").className="meta err";
 $("msg").textContent=e===0?"Nem találtam érvényes kérdést a fájlokban (ellenőrizd a ?, +, - jeleket)."
  :typeof e==="string"?"Nem tölthető be: "+e+" (ellenőrizd a fájlnevet és a temak.txt-t)."
  :"Hiba: "+(e&&e.message||e);
 $("start").disabled=true;
});
</script>
